name: Intuicija - provjera kapije K20 (mail 15.11. i 15.01.)

# 27.09.2026 12:46 (korisnikova zelja): bez dnevnog maila — samo sredinom studenog i sredinom
# sijecnja neka se provjera sama upali i javi mailom stanje Intuicije (kapija K20).
# Skripta sama provjerava datum (scripts/intuicija_status_email.py, SCHEDULED), pa se u
# ostalim godinama nista ne salje. Samo cita bazu; nista ne mijenja.
on:
  schedule:
    - cron: "0 7 15 11 *"   # 15. studenog u 07:00 UTC (08:00 u Zagrebu)
    - cron: "0 7 15 1 *"    # 15. sijecnja u 07:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Posalji mail i izvan zakazanih dana'
        required: false
        default: false
        type: boolean

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Provjeri Intuiciju i posalji mail
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/intuicija_status_email.py --force
          else
            python scripts/intuicija_status_email.py
          fi
