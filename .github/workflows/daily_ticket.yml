name: Daily Tennis Ticket

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (ne šalji email, ne spremi u DB)'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-ticket:
    runs-on: ubuntu-latest
    # 35, bilo 20 (02.08.2026): run od 02.08. je GitHub prekinuo TOČNO na 20 minuta usred
    # analize ("The operation was canceled" + "Terminate orphan process: python") — tiket
    # nije spremljen ni poslan. Uzrok nije broj mečeva (32 danas naspram 31 dana 27.07.,
    # kad je isti posao trajao ~12 min) nego promjene od 31.07.-01.08.: key_factors ima 6
    # obaveznih polja umjesto 3, max_tokens je 1500 -> 2600, prompt je narastao za pravila
    # 15/16 + klizne pragove + underdog pravilo + brzinu terena + lokalno vrijeme, a prozor
    # dohvaća tri dana umjesto dva. Sve su korisne promjene, samo im treba više vremena.
    # 35 daje ~15 min rezerve za pun raspored; GitHub dopušta i puno više (limit je 6 sati).
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily ticket
        # ZA REVIZIJU (uoceno 07.08.2026): dodati PYTHONUNBUFFERED: "1" u env ispod.
        # Bez toga Python puferira stdout pa se ispis pojavljuje u nakupinama — u runu od
        # 27.07. bilo je 4,5 minute tisine pa sve odjednom. Kad je run 02.08. prekinut na
        # 20 minuta, iz loga se NIJE moglo vidjeti gdje je zapeo; timeout je podignut na 35
        # na temelju zakljucivanja, ne mjerenja. Jedna varijabla, nula utjecaja na pickove —
        # ali mijenja izgled logova, pa ide zajedno s ostalim izmjenama na reviziji, ne usput.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAPID_API_KEY: ${{ secrets.RAPID_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python agent/run_daily.py --dry-run
          else
            python agent/run_daily.py
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs
          path: '*.log'
          retention-days: 7
